<script>
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const W = 900, H = 520;
const logoEl  = document.getElementById('logo-overlay');
const innovEl = document.getElementById('innov');
const replayBtn = document.getElementById('replay-btn');

/* ── Impact point (where hero drop lands = where V lives) ── */
const IX = 305, IY = 305;

/*
  CLIP-PATH STRATEGY
  ------------------
  The logo image is 88% wide, centered → starts at ~6% from left.
  The water-V splash occupies the leftmost ~33% of the logo image.
  33% of 88% = 29% of container, starting at 6% → right edge at ~35%.
  So inset(0 X% 0 0) where X=65 shows ONLY the V.
  Animating X: 65 → 0 reveals ersaLux left-to-right.
*/
/* ── Timing (seconds) ── */
// Hero drop (delay 0.42) → fall f1=0.38 → plunge f2=0.32 → impacts at 1.12s
const T = {
  vFadeStart:   1.40,   // V (clipped logo) starts fading in
  vFadeEnd:     2.20,   // V fully opaque — spotlight begins
  vHoldEnd:     3.10,   // V holds alone until here
  ersaStart:    3.10,   // clip expands → ersaLux sweeps in
  ersaEnd:      3.85,   // full logo visible
  innovStart:   2.95,   // Innovations LLC slides up
  innovEnd:     3.75,
  done:         4.90,
};

/* ── Easing ── */
const eI  = t => t * t;
const eI3 = t => t * t * t;
const eO3 = t => 1 - Math.pow(1 - t, 3);
const c01 = t => Math.max(0, Math.min(1, t));

/* ── Teardrop ── */
function teardrop(cx, cy, r, al) {
  al = (al === undefined) ? 1 : al;
  ctx.save();
  ctx.globalAlpha = al;
  ctx.beginPath();
  ctx.moveTo(cx, cy - r*2.05);
  ctx.bezierCurveTo(cx-r*.42, cy-r*1.1,  cx-r, cy-r*.22, cx-r, cy+r*.25);
  ctx.bezierCurveTo(cx-r,     cy+r*.95,  cx-r*.5, cy+r*1.3, cx, cy+r*1.3);
  ctx.bezierCurveTo(cx+r*.5,  cy+r*1.3,  cx+r, cy+r*.95,   cx+r, cy+r*.25);
  ctx.bezierCurveTo(cx+r,     cy-r*.22,  cx+r*.42, cy-r*1.1, cx, cy-r*2.05);
  ctx.closePath();
  const g = ctx.createRadialGradient(cx-r*.3, cy-r*.4, 0, cx, cy, r*1.65);
  g.addColorStop(0,   '#c2eaff');
  g.addColorStop(0.4, '#42aaee');
  g.addColorStop(1,   '#1858a8');
  ctx.fillStyle = g;
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(cx-r*.28, cy-r*.55, r*.22, r*.38, -0.3, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,0.68)';
  ctx.fill();
  ctx.restore();
}


/* ── Splash particles — V-shaped spray on hero impact ── */
const SPLASH_G    = 600;   // gravity px/s²
const SPLASH_T0   = 1.12;  // impact time (seconds)
const SPLASH_LIFE = 1.05;  // particle lifetime (seconds)

// Each entry: vx, vy = launch velocity in px/s  |  r = radius  |  a = peak alpha
// Physics: x = IX + vx*pt,  y = IY + vy*pt + 0.5*SPLASH_G*pt²
const splashParticles = [
  // — Left arm (upper-left arcs, tracing V left side) —
  {vx:-146, vy:-471, r:6.5, a:1.0},  // tip of left arm
  {vx:-160, vy:-455, r:5.0, a:0.90},
  {vx:-132, vy:-440, r:4.2, a:0.85},
  {vx:-118, vy:-363, r:5.5, a:1.0},  // mid left
  {vx:-130, vy:-345, r:3.8, a:0.80},
  {vx:-108, vy:-378, r:3.2, a:0.75},
  {vx: -84, vy:-257, r:4.8, a:0.90},  // lower left
  {vx: -74, vy:-240, r:3.0, a:0.75},
  {vx:-200, vy:-310, r:3.0, a:0.65},  // wide scatter left
  {vx:-235, vy:-275, r:2.5, a:0.55},
  {vx:-170, vy:-480, r:2.8, a:0.68},

  // — Right arm (upper-right arcs, tracing V right side) —
  {vx:+125, vy:-431, r:6.0, a:1.0},  // tip of right arm
  {vx:+138, vy:-415, r:5.0, a:0.90},
  {vx:+112, vy:-398, r:4.2, a:0.85},
  {vx: +96, vy:-346, r:5.0, a:1.0},  // mid right
  {vx:+106, vy:-328, r:3.8, a:0.80},
  {vx: +86, vy:-360, r:3.2, a:0.75},
  {vx: +62, vy:-245, r:4.8, a:0.90},  // lower right
  {vx: +54, vy:-228, r:3.0, a:0.75},
  {vx:+175, vy:-290, r:3.0, a:0.65},  // wide scatter right
  {vx:+210, vy:-258, r:2.5, a:0.55},
  {vx:+148, vy:-445, r:2.8, a:0.68},

  // — Central upward burst —
  {vx:  -8, vy:-490, r:7.0, a:1.0},
  {vx: +14, vy:-465, r:6.0, a:0.92},
  {vx: -38, vy:-420, r:4.5, a:0.85},
  {vx: +38, vy:-405, r:4.5, a:0.85},
  {vx:   0, vy:-510, r:5.5, a:0.88},
  {vx: -58, vy:-368, r:3.5, a:0.72},
  {vx: +58, vy:-352, r:3.5, a:0.72},
];

function drawSplash(t) {
  const pt = t - SPLASH_T0;
  if (pt <= 0 || pt >= SPLASH_LIFE) return;
  const lifeFrac = pt / SPLASH_LIFE;
  splashParticles.forEach(p => {
    const px = IX + p.vx * pt;
    const py = IY + p.vy * pt + 0.5 * SPLASH_G * pt * pt;
    // fade: ramp up briefly then fade out
    const al = p.a * Math.pow(1 - lifeFrac, 0.5) * Math.min(1, lifeFrac * 8);
    if (al <= 0.02) return;
    ctx.save();
    ctx.globalAlpha = al;
    const g = ctx.createRadialGradient(
      px - p.r * 0.3, py - p.r * 0.35, 0,
      px, py, p.r * 1.5
    );
    g.addColorStop(0,   '#d4f0ff');
    g.addColorStop(0.35,'#5ab4f5');
    g.addColorStop(0.75,'#1d72c8');
    g.addColorStop(1,   'rgba(10,40,140,0)');
    ctx.beginPath();
    ctx.arc(px, py, p.r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  });
}

/* ── Ripple ── */
function ripple(cx, cy, rad, al) {
  ctx.save();
  ctx.globalAlpha = al;
  ctx.beginPath();
  ctx.ellipse(cx, cy, rad, rad*.28, 0, 0, Math.PI*2);
  ctx.strokeStyle = '#5ab4ff';
  ctx.lineWidth = 1.8;
  ctx.stroke();
  ctx.restore();
}

/* ── Drops ── */
const drops = [
  {x:150, sy:-55, ly:IY-92,  r:5.2, delay:0.00},
  {x:248, sy:-42, ly:IY-108, r:5.0, delay:0.18},
  {x:372, sy:-48, ly:IY-82,  r:5.5, delay:0.30},
  {x:196, sy:-35, ly:IY-97,  r:4.8, delay:0.44},
  {x:336, sy:-44, ly:IY-90,  r:5.0, delay:0.58},
  // Hero — falls straight to IX,IY
  {x:IX,  sy:-55, midY:IY-148, ly:IY, r:9.8, delay:0.42, hero:true},
];

let st = null, raf = null;

function frame(ts) {
  if (!st) st = ts;
  const t = (ts - st) / 1000 * 0.476;  // half speed + extra 0.5s

  /* Background */
  ctx.fillStyle = '#171923';
  ctx.fillRect(0, 0, W, H);

  /* ── Drops ── */
  drops.forEach(d => {
    const dt = t - d.delay;
    if (dt < 0) return;

    if (!d.hero) {
      const dur = 0.62;
      if (dt < dur) {
        teardrop(d.x, d.sy + (d.ly - d.sy) * eI(dt / dur), d.r);
      } else {
        const rt = dt - dur;
        for (let i = 0; i < 2; i++) {
          const rd = rt - i * 0.1;
          if (rd > 0 && rd < 0.75) {
            const rp = rd / 0.75;
            ripple(d.x, d.ly, 4 + rp * 22, (1 - rp) * 0.4);
          }
        }
      }
    } else {
      /* Hero: fall to midY then immediately plunge — no pause */
      const f1 = 0.38, f2 = 0.32;
      if (dt < f1) {
        const pp = eI(dt / f1);
        teardrop(d.x, d.sy + (d.midY - d.sy) * pp, d.r);
      } else if (dt < f1 + f2) {
        const pp = eI3((dt - f1) / f2);
        const cy = d.midY + (d.ly - d.midY) * pp;
        const sk = 1 + pp * 0.42;
        ctx.save();
        ctx.translate(d.x, cy); ctx.scale(1 / sk, sk); ctx.translate(-d.x, -cy);
        teardrop(d.x, cy, d.r);
        ctx.restore();
      }
      /* Impact ripples */
      const it = dt - (f1 + f2);
      if (it > 0 && it < 1.2) {
        for (let i = 0; i < 6; i++) {
          const rd = it - i * 0.08;
          if (rd > 0 && rd < 0.88) {
            const rp = rd / 0.88;
            ripple(IX, IY, 4 + rp * 68, (1 - rp) * 0.65);
          }
        }
      }
    }
  });

  /* ── Upward V-shaped water splash particles ── */
  drawSplash(t);

  /* ── Full logo (V + ersaLux) fades in simultaneously ── */
  if (t >= T.vFadeStart) {
    const fadeP = c01((t - T.vFadeStart) / (T.vFadeEnd - T.vFadeStart));
    logoEl.style.opacity = eO3(fadeP).toFixed(3);

  }

  /* ── Innovations LLC ── */
  if (t >= T.innovStart) {
    const ip = eO3(c01((t - T.innovStart) / (T.innovEnd - T.innovStart)));
    innovEl.style.opacity = ip.toFixed(3);
    innovEl.style.top = (70 - (1 - ip) * 4) + '%';
  }

  if (t >= T.done) { replayBtn.style.display = 'flex'; return; }
  raf = requestAnimationFrame(frame);
}

function start() {
  st  = null;
  logoEl.style.opacity   = '0';
  innovEl.style.opacity  = '0';
  innovEl.style.top      = '75%';
  replayBtn.style.display = 'none';
  if (raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(frame);
}

replayBtn.addEventListener('click', start);
document.fonts.ready.then(start);
</script>
